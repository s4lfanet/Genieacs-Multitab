<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="acs-page" content="bot">
<title>Pengaturan Bot</title>
<style>
:root{--bg:#fff;--surface:#fff;--fg:#002f2f;--mut:#667078;--bd:#ebe0bf;--pri:#046380;--soft:#f2ebd5;--on:#fff;--ok:#16803c;--bad:#c62828;--warn:#b45309}
*{box-sizing:border-box}html,body{margin:0}
body{font:13px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg);padding:18px 22px 84px}
.wrap{max-width:860px}
h1{font-size:20px;margin:0 0 2px}.sub{color:var(--mut);margin:0 0 14px}
.stat{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border:1px solid var(--bd);border-radius:999px;background:var(--surface);font-weight:600;font-size:12px}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--mut)}.chip.ok i{background:var(--ok)}.chip.warn i{background:var(--warn)}.chip.bad i{background:var(--bad)}
.card{background:var(--surface);border:1px solid var(--bd);border-radius:14px;margin-bottom:16px;overflow:hidden}
.card>header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--bd);background:var(--soft)}
.card>header .ic{flex:none;width:34px;height:34px;border-radius:10px;background:var(--pri);color:var(--on);display:flex;align-items:center;justify-content:center}
.card>header svg{width:18px;height:18px}
.card>header h2{margin:0;font-size:14px}.card>header p{margin:1px 0 0;color:var(--mut);font-size:12px}
.f{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:14px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--bd)}
.f:last-child{border-bottom:0}
.f label{font-weight:600}.f small{display:block;color:var(--mut);font-weight:400;font-size:11.5px;margin-top:1px}
.f .ok{color:var(--ok)}
input[type=text],input[type=number],input[type=password],select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:8px 10px;width:100%;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 22%,transparent)}
input::placeholder{color:var(--mut)}
.sw{position:relative;display:inline-block;width:42px;height:24px}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;width:100%;height:100%;z-index:1}
.sw i{position:absolute;inset:0;border-radius:999px;background:var(--bd);transition:background .15s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .15s}
.sw input:checked+i{background:var(--pri)}.sw input:checked+i::after{transform:translateX(18px)}
.sw input:focus-visible+i{box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 30%,transparent)}
.swr{display:flex;align-items:center;gap:10px}.swr span{color:var(--mut);font-size:12px}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:12px 190px 12px 22px;background:var(--surface);border-top:1px solid var(--bd);box-shadow:0 -4px 16px rgba(0,0,0,.12)}
#msg{flex:1;font-size:12.5px;color:var(--mut)}#msg.ok{color:var(--ok)}#msg.er{color:var(--bad)}#msg.dirty{color:var(--warn)}
.btn{font:inherit;font-weight:600;border:1px solid var(--bd);background:var(--surface);color:var(--fg);border-radius:9px;padding:8px 18px;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--pri)}.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--on)}.btn:disabled{opacity:.45;cursor:not-allowed}
.err{border:1px solid var(--bad);background:color-mix(in srgb,var(--bad) 9%,transparent);border-radius:14px;padding:16px 18px}
.err b{color:var(--bad);font-size:14px}.err p{margin:6px 0 0}.err ul{margin:8px 0 12px 18px;padding:0;color:var(--mut)}.err code{font-family:ui-monospace,Consolas,monospace;background:var(--soft);border-radius:6px;padding:1px 6px}
@media (max-width:640px){.f{grid-template-columns:1fr;gap:8px}body{padding:14px 14px 84px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Pengaturan Bot</h1>
  <p class="sub">Bot Telegram, asisten AI, dan bot WhatsApp. Bot membaca ulang pengaturan ini tiap putaran, jadi tidak perlu restart.</p>
  <div class="stat" id="stat"></div>
  <div id="form">Memuat…</div>
</div>
<div id="bar"><span id="msg"></span><button class="btn" id="cancel" disabled>Batalkan</button><button class="btn pri" id="save" disabled>Simpan</button></div>
<script>
"use strict";
(function(){
  var M={"--bg":"--acs-bg","--surface":"--acs-surface","--fg":"--acs-text","--mut":"--acs-muted","--bd":"--acs-border","--pri":"--acs-accent","--soft":"--acs-soft","--on":"--acs-on-accent","--ok":"--acs-ok","--bad":"--acs-bad","--warn":"--acs-warn"};
  function ap(){var r=document.documentElement;try{var p=parent.document.documentElement,cs=parent.getComputedStyle(p);
    Object.keys(M).forEach(function(k){var v=cs.getPropertyValue(M[k]).trim();if(v)r.style.setProperty(k,v)});
    r.classList.toggle("dark",p.classList.contains("acs-dark"))}catch(e){}}
  ap();try{new MutationObserver(ap).observe(parent.document.documentElement,{attributes:true})}catch(e){}
})();

var ICON={
  tg:"<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M21 4L3 11l6 2.5L11.5 20l3-5 5 3.5z'/><path d='M9 13.5L21 4'/></svg>",
  ai:"<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z'/><path d='M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z'/></svg>",
  tune:"<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6'/></svg>",
  wa:"<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M21 11.5a8.4 8.4 0 0 1-12.2 7.5L3 20.5l1.6-5.3A8.4 8.4 0 1 1 21 11.5z'/><path d='M9 11.5h.01M12 11.5h.01M15 11.5h.01'/></svg>"
};
var BOOL=[["true","aktif"],["false","nonaktif"]];
var GROUPS=[
 {t:"Bot Telegram",d:"Token dari @BotFather dan siapa yang boleh memakai bot.",i:"tg",f:[
  ["bot.enabled","Bot aktif","bool"],
  ["bot.telegram.token","Token bot","secret","dari @BotFather; tidak pernah ditampilkan lagi setelah disimpan"],
  ["bot.telegram.allowedChatIds","Chat ID yang diizinkan","text","pisahkan dengan koma atau spasi; kosong = semua ditolak"],
  ["bot.alert.chatIds","Penerima alert","text","kosong = sama dengan Chat ID di atas"],
  ["bot.alert.everyMinutes","Cek alert tiap (menit)","num"],
  ["bot.alert.faultThreshold","Alert bila fault ≥","num","jumlah fault yang memicu peringatan"],
  ["bot.actions.enabled","Izinkan aksi","bool","ubah SSID/password dan reboot; tetap minta konfirmasi"]]},
 {t:"Isi Bot",d:"Ambang dan jumlah daftar yang dipakai perintah bot (Telegram & WhatsApp). Kosongkan kolom untuk kembali ke nilai bawaan.",i:"tune",f:[
  ["bot.redaman.limit","Redaman maksimum (dBm)","numr","/redaman menampilkan ONT dengan RX lebih rendah dari ini. Bawaan -25",{def:-25,min:-60,max:0}],
  ["bot.redaman.good","Batas sinyal bagus (dBm)","numr","untuk penjelasan asisten AI (sinyal ≥ nilai ini = bagus). Bawaan -18",{def:-18,min:-60,max:0}],
  ["bot.redaman.floor","Abaikan RX di bawah (dBm)","numr","nilai yang lebih rendah dianggap tidak valid/ONT mati. Bawaan -60",{def:-60,min:-100,max:0}],
  ["bot.online.minutes","ONT dianggap online (menit)","numr","inform terakhir lebih baru dari ini = online. Bawaan 15",{def:15,min:1,max:1440}],
  ["bot.list.redaman","Maks daftar /redaman","numr","bawaan 30",{def:30,min:1,max:100,int:1}],
  ["bot.list.offline","Maks daftar /offline","numr","bawaan 25",{def:25,min:1,max:100,int:1}],
  ["bot.list.cari","Maks hasil /cari","numr","bawaan 20",{def:20,min:1,max:50,int:1}],
  ["bot.list.fault","Maks daftar /fault","numr","bawaan 15",{def:15,min:1,max:100,int:1}],
  ["bot.help.footer","Teks tambahan di /help","text","opsional, mis. kontak admin. Tampil di bawah daftar perintah"]]},
 {t:"Asisten AI",d:"Dipakai perintah /tanya (hanya membaca). Ganti provider kapan saja.",i:"ai",f:[
  ["bot.ai.enabled","AI aktif","bool"],
  ["bot.ai.provider","Provider","sel","",["anthropic","openrouter","openai"]],
  ["bot.ai.apiKey","API key","secret","tidak pernah ditampilkan lagi setelah disimpan"],
  ["bot.ai.model","Model","text"],
  ["bot.ai.baseUrl","Base URL","text","opsional, untuk endpoint OpenAI-compatible lain"],
  ["bot.ai.dailyLimit","Batas pertanyaan per hari","num"]]},
 {t:"Bot WhatsApp",d:"Berlaku bila bot WhatsApp dipasang. Scan QR di menu Bot WA.",i:"wa",f:[
  ["wabot.enabled","Bot WA aktif","bool"],
  ["wabot.allowedNumbers","Nomor yang diizinkan","text","format 628xxxx, pisahkan dengan koma"],
  ["wabot.actions.enabled","Izinkan aksi","bool"],
  ["wabot.alert.numbers","Penerima alert","text"],
  ["wabot.alert.everyMinutes","Cek alert tiap (menit)","num"],
  ["wabot.alert.faultThreshold","Alert bila fault ≥","num"]]}
];
var cur={},dirty=false;
function $(i){return document.getElementById(i)}
function say(t,c){var m=$("msg");m.textContent=t||"";m.className=c||""}
function api(method,path,body){
  return fetch(path,{method:method,credentials:"same-origin",headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined})
    .then(function(r){return r.text().then(function(t){
      if(r.status===401||r.status===403)throw new Error("Tidak diizinkan (login GenieACS sebagai admin dulu)");
      if(!r.ok)throw new Error("HTTP "+r.status+" "+t.slice(0,120));
      return t?JSON.parse(t):null})});
}
function plain(v){v=String(v==null?"":v).trim();if(v.length>=2&&((v[0]==="'"&&v[v.length-1]==="'")||(v[0]==='"'&&v[v.length-1]==='"')))v=v.slice(1,-1);return v}
function el(tag,props,kids){var e=document.createElement(tag);Object.keys(props||{}).forEach(function(k){if(k==="text")e.textContent=props[k];else e.setAttribute(k,props[k])});(kids||[]).forEach(function(c){e.appendChild(c)});return e}
function isSet(k){var v=plain(cur[k]);return !!v&&!/^ISI_/.test(v)}
function on(k,d){var v=plain(cur[k]);return v===""?d:v.toLowerCase()==="true"}
// error tampil di TENGAH halaman (bukan hanya di bar bawah), supaya tidak terlihat seperti halaman kosong
function showError(msg){
  var box=$("form");box.textContent="";
  var c=el("div",{"class":"err"},[el("b",{text:"Pengaturan bot tidak bisa dimuat"}),el("p",{text:String(msg)}),
    el("ul",{},[el("li",{text:"Login ke GenieACS sebagai user dengan izin Config (baca & tulis)."}),
      el("li",{text:"Buka halaman ini dari alamat yang sama dengan GenieACS (host:port yang sama)."}),
      el("li",{text:"Di server, jalankan audit: bash scripts/diagnose.sh"})])]);
  var b=el("button",{"class":"btn pri",text:"Coba lagi"});b.onclick=function(){box.textContent="Memuat…";load()};c.appendChild(b);box.appendChild(c);
  say("");$("save").disabled=true;$("cancel").disabled=true;
}
window.addEventListener("error",function(e){showError(e.message||"kesalahan skrip")});
window.addEventListener("unhandledrejection",function(e){showError((e.reason&&e.reason.message)||e.reason)});
function setDirty(v){dirty=v;$("save").disabled=!v;$("cancel").disabled=!v;if(v)say("Ada perubahan yang belum disimpan","dirty");else if($("msg").className==="dirty")say("")}

function status(){
  var s=$("stat");s.textContent="";
  function chip(cls,t){s.appendChild(el("span",{"class":"chip "+cls},[el("i"),document.createTextNode(t)]))}
  if(!on("bot.enabled",true))chip("","Telegram nonaktif");
  else if(!isSet("bot.telegram.token"))chip("warn","Telegram: token belum diisi");
  else chip("ok","Telegram aktif");
  if(on("bot.ai.enabled",false))chip(isSet("bot.ai.apiKey")?"ok":"warn","AI aktif · "+(plain(cur["bot.ai.provider"])||"anthropic")+(isSet("bot.ai.apiKey")?"":" (API key belum diisi)"));
  else chip("","AI nonaktif");
  var n=plain(cur["wabot.allowedNumbers"]).split(/[\s,;]+/).filter(Boolean).length;
  if(on("wabot.enabled",false))chip(n?"ok":"warn","WhatsApp aktif · "+n+" nomor"+(n?"":" (belum ada nomor)"));
  else chip("","WhatsApp nonaktif");
}

function build(){
  var box=$("form");box.textContent="";
  GROUPS.forEach(function(g){
    var head=el("header",{},[]);
    var ic=el("span",{"class":"ic"});ic.innerHTML=ICON[g.i];
    head.appendChild(ic);head.appendChild(el("div",{},[el("h2",{text:g.t}),el("p",{text:g.d})]));
    var card=el("section",{"class":"card"},[head]);
    g.f.forEach(function(f){
      var key=f[0],type=f[2],hint=f[3]||"",inp;
      var lab=el("label",{"for":key,text:f[1]});
      if(hint)lab.appendChild(el("small",{text:hint}));
      if(type==="bool"){
        var cb=el("input",{type:"checkbox",id:key});cb.checked=on(key,key==="bot.enabled");
        var st=el("span",{text:cb.checked?"aktif":"nonaktif"});cb.addEventListener("change",function(){st.textContent=cb.checked?"aktif":"nonaktif"});
        inp=el("div",{"class":"swr"},[el("label",{"class":"sw"},[cb,el("i")]),st]);
      }else if(type==="sel"){
        inp=el("select",{id:key},f[4].map(function(x){var op=el("option",{value:x,text:x});if(plain(cur[key])===x)op.selected=true;return op}));
      }else if(type==="secret"){
        inp=el("input",{id:key,type:"password",autocomplete:"new-password",placeholder:isSet(key)?"•••••••• tersimpan — kosongkan untuk tidak mengubah":"belum diisi"});
        if(isSet(key))lab.appendChild(el("small",{"class":"ok",text:"✓ sudah tersimpan"}));
      }else{
        inp=el("input",{id:key,type:type==="num"?"number":(type==="numr"?"number":"text"),value:plain(cur[key])});
        if(type==="numr"){var o=f[4]||{};inp.setAttribute("step",o.int?"1":"any");inp.setAttribute("min",o.min);inp.setAttribute("max",o.max);inp.setAttribute("placeholder","bawaan "+o.def)}
      }
      card.appendChild(el("div",{"class":"f"},[lab,inp]));
    });
    box.appendChild(card);
  });
  box.oninput=box.onchange=function(){setDirty(true)};
  status();setDirty(false);
}
function load(){
  return Promise.all(["bot.%","wabot.%"].map(function(p){return api("GET","/api/config/?filter="+encodeURIComponent('_id LIKE "'+p+'"'))})).then(function(r){
    cur={};r[0].concat(r[1]).forEach(function(c){cur[c._id]=c.value});build();say("")}).catch(function(e){showError(e.message)});
}
function save(){
  var jobs=[],bad=null;
  GROUPS.forEach(function(g){g.f.forEach(function(f){
    var key=f[0],type=f[2],node=$(key);if(!node)return;
    var v=type==="bool"?(node.checked?"true":"false"):node.value.trim();
    if(type==="secret"&&v==="")return;                       // kosong = jangan ubah
    if(/['"\\]/.test(v)){bad=f[1]+": tidak boleh berisi tanda kutip atau backslash";return}
    if(type==="numr"){
      var o=f[4]||{};
      if(v===""){                                              // kosong = kembali ke bawaan (hapus key)
        if(cur[key]!==undefined)jobs.push(function(){return api("DELETE","/api/config/"+encodeURIComponent(key)).then(function(){delete cur[key]})});
        return}
      var nv=Number(v);
      if(isNaN(nv)||nv<o.min||nv>o.max||(o.int&&nv%1!==0)){bad=f[1]+": harus angka "+(o.int?"bulat ":"")+"antara "+o.min+" dan "+o.max;return}
      var vv=String(nv);
      if(cur[key]!==undefined&&plain(cur[key])===vv)return;
      jobs.push(function(){return api("PUT","/api/config/"+encodeURIComponent(key),{_id:key,value:vv}).then(function(){cur[key]=vv})});
      return}
    if(type==="num"&&v===""&&cur[key]===undefined)return;
    if(type==="num"){if(v===""||isNaN(Number(v))||Number(v)<0){bad=f[1]+": harus angka";return}}
    var val=type==="num"?String(Number(v)):"'"+v+"'";
    if(cur[key]!==undefined&&String(cur[key]).trim()===val)return;   // tidak berubah
    if(cur[key]===undefined&&v===""&&type!=="bool")return;          // tidak ada & kosong: tidak perlu dibuat
    jobs.push(function(){return api("PUT","/api/config/"+encodeURIComponent(key),{_id:key,value:val}).then(function(){cur[key]=val})});
  })});
  if(bad)return say(bad,"er");
  if(!jobs.length){setDirty(false);return say("Tidak ada perubahan")}
  say("Menyimpan…");$("save").disabled=true;
  Promise.all(jobs.map(function(j){return j()})).then(function(){build();say(jobs.length+" pengaturan tersimpan","ok")}).catch(function(e){$("save").disabled=false;say("Gagal menyimpan: "+e.message,"er")});
}
$("save").onclick=save;
$("cancel").onclick=function(){build();say("")};
load();
</script>
</body>
</html>
