<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Peta Pelanggan</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
:root{--bg:#fff;--fg:#1a1d21;--mut:#6b7280;--bd:#d9dde3;--pri:#2563eb;--bad:#dc2626;--ok:#16a34a;--warn:#d97706}
:root.dark{--bg:#161a20;--fg:#e6e8eb;--mut:#9aa3af;--bd:#2d333b;--pri:#60a5fa}
.dark .osm-tiles{filter:invert(1) hue-rotate(180deg) brightness(.95) contrast(.9)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:14px system-ui,sans-serif;background:var(--bg);color:var(--fg);display:flex}
#side{width:340px;max-width:45vw;display:flex;flex-direction:column;border-right:1px solid var(--bd)}
#map{flex:1}
header{padding:10px 12px;border-bottom:1px solid var(--bd)}
header h1{font-size:15px;margin:0 0 8px}
input,select,textarea,button{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;width:100%}
button{cursor:pointer;width:auto}button.pri{background:var(--pri);border-color:var(--pri);color:#fff}button.bad{color:var(--bad)}
.row{display:flex;gap:6px;margin-top:6px}.tabs button{flex:1;border-radius:0}.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
#list{flex:1;overflow:auto}
.it{padding:8px 12px;border-bottom:1px solid var(--bd);cursor:pointer}.it:hover,.it.sel{background:rgba(37,99,235,.1)}
.it small{color:var(--mut);display:block}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
#edit{border-top:1px solid var(--bd);padding:10px 12px;display:none}#edit label{display:block;margin-top:6px;color:var(--mut);font-size:12px}
#msg{padding:6px 12px;font-size:12px;color:var(--mut);min-height:28px}
#hint{position:absolute;z-index:1000;top:10px;left:50%;transform:translateX(-50%);background:var(--pri);color:#fff;padding:6px 12px;border-radius:6px;display:none}
@media (max-width:640px){body{flex-direction:column}#side{width:100%;max-width:none;height:50%}}
</style>
</head>
<body>
<div id="side">
  <header>
    <h1>Peta Pelanggan &amp; ODP</h1>
    <input id="q" type="search" placeholder="Cari PPPoE / SN / nama">
    <div class="row tabs"><button id="tOnt" class="on">ONT</button><button id="tOdp">ODP</button></div>
  </header>
  <div id="msg"></div>
  <div id="list"></div>
  <div id="edit"></div>
</div>
<div id="map"></div>
<div id="hint"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
"use strict";
(function(){function ap(){var d=false;try{d=window.parent!==window&&parent.document.documentElement.classList.contains("acs-dark")}catch(e){}document.documentElement.classList.toggle("dark",d)}
ap();try{new MutationObserver(ap).observe(parent.document.documentElement,{attributes:true,attributeFilter:["class"]})}catch(e){}})();
var state={devices:[],odps:[],tab:location.hash==="#odp"?"odp":"ont",sel:null};
var $=function(i){return document.getElementById(i)};
function el(tag,props,kids){var e=document.createElement(tag);Object.keys(props||{}).forEach(function(k){if(k==="text")e.textContent=props[k];else if(k.slice(0,2)==="on")e[k]=props[k];else e.setAttribute(k,props[k])});(kids||[]).forEach(function(c){e.appendChild(c)});return e}
function say(t){$("msg").textContent=t||""}

var map=L.map("map").setView([-2.5,118],5);
var osm=L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap",className:"osm-tiles"});
var sat=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Esri"});
osm.addTo(map);L.control.layers({"Peta":osm,"Satelit":sat}).addTo(map);
var layer=L.layerGroup().addTo(map);

// ---- data: API GenieACS sendiri (sama-asal, memakai cookie login GenieACS) ----
// ONT dibaca dari /api/devices (hanya GET). Lokasi & ODP disimpan di satu key Config "peta.data"
// (JSON -> base64 dalam kutip tunggal, supaya tetap ekspresi Config yang valid).
var CFG="peta.data";
function api(method,path,body){
  return fetch(path,{method:method,credentials:"same-origin",headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined})
    .then(function(r){return r.text().then(function(t){
      if(r.status===401||r.status===403)throw new Error("Tidak diizinkan (login GenieACS sebagai admin dulu)");
      if(!r.ok)throw new Error("HTTP "+r.status+" "+t.slice(0,120));
      return t?JSON.parse(t):null})});
}
function readStore(){
  return api("GET","/api/config/?filter="+encodeURIComponent('_id LIKE "'+CFG+'"')).then(function(r){
    var s={devices:{},odps:{}},row=r&&r[0];
    if(row&&row.value){try{s=JSON.parse(decodeURIComponent(escape(atob(String(row.value).replace(/^['"]|['"]$/g,"")))))}catch(e){throw new Error("data peta.data rusak")}}
    s.devices=s.devices||{};s.odps=s.odps||{};return s});
}
function writeStore(s){
  var v="'"+btoa(unescape(encodeURIComponent(JSON.stringify(s))))+"'";
  return api("PUT","/api/config/"+CFG,{_id:CFG,value:v});
}
function mutate(fn){return readStore().then(function(s){var e=fn(s);if(e)throw new Error(e);return writeStore(s)})}
function num(v,lo,hi){var n=Number(v);return isFinite(n)&&n>=lo&&n<=hi?n:null}
function val(d,k){var x=d[k];return x&&x.value&&x.value[0]!=null?x.value[0]:null}

var PROJ=["DeviceID.ID","DeviceID.SerialNumber","DeviceID.ProductClass","Events.Inform","VirtualParameters.pppoeUsername","VirtualParameters.RXPower","VirtualParameters.redaman"].join(",");
function load(){
  return Promise.all([api("GET","/api/devices/?projection="+encodeURIComponent(PROJ)),readStore()]).then(function(r){
    var devs=r[0]||[],st=r[1],now=Date.now();
    state.devices=devs.map(function(d){
      var id=val(d,"DeviceID.ID")||d._id,li=val(d,"Events.Inform"),t=typeof li==="number"?li:Date.parse(li)||0;
      var m=String(val(d,"VirtualParameters.RXPower")!=null?val(d,"VirtualParameters.RXPower"):val(d,"VirtualParameters.redaman")!=null?val(d,"VirtualParameters.redaman"):"").match(/-?\d+(\.\d+)?/);
      return {id:id,sn:val(d,"DeviceID.SerialNumber")||"",model:val(d,"DeviceID.ProductClass")||"",pppoe:val(d,"VirtualParameters.pppoeUsername")||"",
        rx:m?Number(m[0]):null,online:t>0&&now-t<10*60*1000,loc:st.devices[id]||null};
    });
    var used={};Object.keys(st.devices).forEach(function(k){var o=st.devices[k].odp;if(o)used[o]=(used[o]||0)+1});
    state.odps=Object.keys(st.odps).map(function(id){return Object.assign({id:id,used:used[id]||0},st.odps[id])});
    draw();
    say(state.devices.filter(function(x){return x.loc}).length+" dari "+state.devices.length+" ONT sudah dipetakan, "+state.odps.length+" ODP");
  }).catch(function(e){say("Gagal memuat: "+e.message)});
}
function rxColor(d){if(!d.online)return "#dc2626";if(d.rx==null||isNaN(d.rx))return "#6b7280";return d.rx<-27?"#d97706":"#16a34a"}
function icon(color,sq){return L.divIcon({className:"",html:'<div style="width:'+(sq?16:14)+'px;height:'+(sq?16:14)+'px;background:'+color+';border:2px solid #fff;border-radius:'+(sq?"3px":"50%")+';box-shadow:0 0 3px #000"></div>',iconSize:[18,18],iconAnchor:[9,9]})}
function title(d){return (d.loc&&d.loc.name)||d.pppoe||d.sn||d.id}

function draw(){
  layer.clearLayers();
  state.devices.forEach(function(d){if(!d.loc)return;
    var m=L.marker([d.loc.lat,d.loc.lng],{icon:icon(rxColor(d))}).addTo(layer);
    m.bindTooltip(title(d));m.on("click",function(){select("ont",d.id)});
    if(d.loc.odp){var o=state.odps.filter(function(x){return x.id===d.loc.odp})[0];if(o)L.polyline([[d.loc.lat,d.loc.lng],[o.lat,o.lng]],{color:"#94a3b8",weight:1,dashArray:"4"}).addTo(layer)}
  });
  state.odps.forEach(function(o){var m=L.marker([o.lat,o.lng],{icon:icon("#2563eb",true)}).addTo(layer);
    m.bindTooltip(o.name+" ("+o.used+"/"+o.capacity+")");m.on("click",function(){select("odp",o.id)})});
  list();
}
function list(){
  var q=$("q").value.toLowerCase(),box=$("list");box.textContent="";
  if(state.tab==="ont"){
    state.devices.filter(function(d){return !q||(d.pppoe+" "+d.sn+" "+(d.loc?d.loc.name:"")).toLowerCase().indexOf(q)>=0})
      .sort(function(a,b){return (a.loc?1:0)-(b.loc?1:0)||title(a).localeCompare(title(b))}).slice(0,300).forEach(function(d){
        box.appendChild(el("div",{"class":"it"+(state.sel&&state.sel.id===d.id?" sel":""),onclick:function(){select("ont",d.id)}},[
          el("span",{"class":"dot",style:"background:"+rxColor(d)}),el("b",{text:title(d)}),
          el("small",{text:(d.loc?"":"belum dipetakan · ")+(d.model||"")+" · "+(d.rx!=null&&!isNaN(d.rx)?d.rx+" dBm":"-")})]))});
  }else{
    state.odps.filter(function(o){return !q||o.name.toLowerCase().indexOf(q)>=0}).forEach(function(o){
      box.appendChild(el("div",{"class":"it",onclick:function(){select("odp",o.id)}},[el("b",{text:o.name}),el("small",{text:o.used+"/"+o.capacity+" port"})]))});
    box.appendChild(el("div",{"class":"it",onclick:function(){select("odp",null)}},[el("b",{text:"+ ODP baru"})]));
  }
}
function field(label,id,val,type){return [el("label",{text:label,"for":id}),el(type||"input",{id:id,value:val||""})]}
function select(kind,id){
  state.sel={kind:kind,id:id};state.tab=kind;$("tOnt").className=kind==="ont"?"on":"";$("tOdp").className=kind==="odp"?"on":"";
  var f=$("edit");f.textContent="";f.style.display="block";
  if(kind==="ont"){
    var d=state.devices.filter(function(x){return x.id===id})[0];if(!d)return;
    var l=d.loc||{};
    f.appendChild(el("b",{text:(d.pppoe||d.sn)+"  ["+d.id+"]"}));
    field("Nama pelanggan","fName",l.name).forEach(function(x){f.appendChild(x)});
    var sl=el("select",{id:"fOdp"},[el("option",{value:"",text:"- tanpa ODP -"})].concat(state.odps.map(function(o){var op=el("option",{value:o.id,text:o.name+" ("+o.used+"/"+o.capacity+")"});if(o.id===l.odp)op.selected=true;return op})));
    f.appendChild(el("label",{text:"ODP"}));f.appendChild(sl);
    field("Catatan","fNotes",l.notes).forEach(function(x){f.appendChild(x)});
    f.appendChild(el("div",{"class":"row"},[
      el("button",{"class":"pri",text:l.lat!=null?"Pindah lokasi":"Tandai di peta",onclick:function(){pick(function(ll){saveOnt(d,ll.lat,ll.lng)})}}),
      el("button",{text:"Simpan",onclick:function(){if(l.lat==null)return say("Tandai lokasi dulu");saveOnt(d,l.lat,l.lng)}}),
      el("button",{"class":"bad",text:"Hapus",onclick:function(){if(confirm("Hapus lokasi ONT ini?"))mutate(function(st){delete st.devices[d.id]}).then(load).then(close).catch(function(e){say(e.message)})}})]));
    if(l.lat!=null)map.setView([l.lat,l.lng],Math.max(map.getZoom(),17));
  }else{
    var o=state.odps.filter(function(x){return x.id===id})[0]||{};
    f.appendChild(el("b",{text:id?"ODP "+id:"ODP baru"}));
    if(!id)field("ID ODP (unik, mis. ODP-01)","oId","").forEach(function(x){f.appendChild(x)});
    field("Nama","oName",o.name).forEach(function(x){f.appendChild(x)});
    field("Kapasitas port","oCap",o.capacity||8,"input").forEach(function(x){f.appendChild(x)});
    field("Catatan","oNotes",o.notes).forEach(function(x){f.appendChild(x)});
    var idv=function(){return id||$("oId").value.trim()};
    var body=function(ll){return {name:$("oName").value,capacity:$("oCap").value,notes:$("oNotes").value,lat:ll.lat,lng:ll.lng}};
    var putOdp=function(ll){var i=idv();if(!i)return say("ID ODP wajib");var b=body(ll),cap=num(b.capacity,1,1024);
      mutate(function(st){st.odps[i]={name:String(b.name||"").trim().slice(0,120)||i,lat:b.lat,lng:b.lng,capacity:cap===null?8:Math.floor(cap),notes:String(b.notes||"").slice(0,500)}}).then(load).then(function(){say("ODP tersimpan")}).catch(function(e){say(e.message)})};
    f.appendChild(el("div",{"class":"row"},[
      el("button",{"class":"pri",text:o.lat!=null?"Pindah lokasi":"Tandai di peta",onclick:function(){pick(putOdp)}}),
      el("button",{text:"Simpan",onclick:function(){if(o.lat==null)return say("Tandai lokasi dulu");putOdp({lat:o.lat,lng:o.lng})}}),
      el("button",{"class":"bad",text:"Hapus",onclick:function(){if(id&&confirm("Hapus ODP ini?"))mutate(function(st){delete st.odps[id];Object.keys(st.devices).forEach(function(k){if(st.devices[k].odp===id)st.devices[k].odp=""})}).then(load).then(close).catch(function(e){say(e.message)})}})]));
    if(o.lat!=null)map.setView([o.lat,o.lng],Math.max(map.getZoom(),17));
  }
  list();
}
function close(){state.sel=null;$("edit").style.display="none";$("edit").textContent="";list()}
function saveOnt(d,lat,lng){
  var odp=$("fOdp").value,name=$("fName").value,notes=$("fNotes").value;
  mutate(function(st){
    if(num(lat,-90,90)===null||num(lng,-180,180)===null)return "lat/lng tidak valid";
    if(odp&&!st.odps[odp])return "ODP tidak ada";
    st.devices[d.id]={name:String(name).trim().slice(0,120),lat:lat,lng:lng,odp:odp,notes:String(notes).slice(0,500),updated:new Date().toISOString()};
  }).then(load).then(function(){say("Tersimpan")}).catch(function(e){say(e.message)});
}
function pick(cb){
  var h=$("hint");h.textContent="Klik lokasi di peta (Esc batal)";h.style.display="block";map.getContainer().style.cursor="crosshair";
  function done(){h.style.display="none";map.getContainer().style.cursor="";map.off("click",on);document.removeEventListener("keydown",esc)}
  function on(e){done();cb({lat:+e.latlng.lat.toFixed(6),lng:+e.latlng.lng.toFixed(6)})}
  function esc(e){if(e.key==="Escape")done()}
  map.once("click",on);document.addEventListener("keydown",esc);
}
$("q").oninput=list;
$("tOnt").onclick=function(){state.tab="ont";$("tOnt").className="on";$("tOdp").className="";list()};
if(state.tab==="odp"){$("tOnt").className="";$("tOdp").className="on"}
$("tOdp").onclick=function(){state.tab="odp";$("tOdp").className="on";$("tOnt").className="";list()};
load();
</script>
</body>
</html>
