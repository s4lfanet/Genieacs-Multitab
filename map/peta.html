<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="acs-page" content="peta">
<title>Peta Pelanggan</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
:root{--bg:#fff;--surface:#fff;--fg:#002f2f;--mut:#667078;--bd:#ebe0bf;--pri:#046380;--soft:#f2ebd5;--on:#fff;--ok:#16803c;--bad:#c62828;--warn:#b45309}
.dark .osm-tiles{filter:invert(1) hue-rotate(180deg) brightness(.95) contrast(.9)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg);display:flex}
#side{width:360px;max-width:46vw;display:flex;flex-direction:column;background:var(--bg);border-right:1px solid var(--bd);min-height:0}
#map{flex:1;background:var(--soft)}
.top{padding:14px 14px 12px;border-bottom:1px solid var(--bd)}
.ttl{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.ttl h1{font-size:15px;margin:0;font-weight:700}
.cnt{font-size:11px;color:var(--mut);background:var(--soft);border-radius:999px;padding:3px 10px;white-space:nowrap}
.srch{position:relative}.srch svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--mut);pointer-events:none}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--bd);border-radius:9px;padding:8px 10px;width:100%;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 22%,transparent)}
input::placeholder{color:var(--mut)}.srch input{padding-left:32px}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;margin-top:10px}
.seg button{flex:1;border:0;background:none;color:var(--mut);border-radius:8px;padding:6px 8px;font:600 12px system-ui,sans-serif;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--pri);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:10px;font-size:11px;color:var(--mut)}.lg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
button{font:inherit}
.btn{border:1px solid var(--bd);background:var(--surface);color:var(--fg);border-radius:9px;padding:7px 12px;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--pri);background:var(--soft)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--on)}.btn.pri:hover{filter:brightness(1.1)}
.btn.bad{color:var(--bad)}.btn.bad:hover{border-color:var(--bad)}
.btn.full{width:100%;margin-top:10px}
#msg{padding:8px 14px;font-size:12px;color:var(--mut);min-height:32px;border-bottom:1px solid var(--bd)}
#list{flex:1;overflow:auto;min-height:0}
.it{display:flex;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bd);cursor:pointer}
.it:hover{background:var(--soft)}.it.sel{background:var(--soft);box-shadow:inset 3px 0 0 var(--pri)}
.dot{flex:none;width:10px;height:10px;border-radius:50%}
.it .tx{flex:1;min-width:0}.it .nm{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .sub{display:block;font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bdg{flex:none;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--soft);color:var(--mut)}
.bdg.ok{color:var(--ok)}.bdg.warn{color:var(--warn)}.bdg.bad{color:var(--bad)}
.cap{display:block;height:5px;background:var(--soft);border-radius:3px;margin-top:5px;overflow:hidden}.cap i{display:block;height:100%;background:var(--pri)}.cap i.full{background:var(--bad)}
.it.new .nm{color:var(--pri)}
#edit{border-top:1px solid var(--bd);padding:12px 14px 14px;display:none;background:var(--surface);max-height:55%;overflow:auto}
#edit h2{font-size:13px;margin:0 0 2px;font-weight:700}#edit .id{font-size:11px;color:var(--mut);word-break:break-all;margin-bottom:4px}
#edit label{display:block;margin:10px 0 4px;color:var(--mut);font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.row{display:flex;gap:6px;margin-top:10px}.row>.btn{flex:none}
.row.pos input{flex:1;min-width:0;padding:7px 10px}
#hint{position:absolute;z-index:1000;top:14px;left:50%;transform:translateX(-50%);background:var(--pri);color:var(--on);padding:8px 16px;border-radius:999px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.3);display:none}
.leaflet-container{font:inherit}
.dark .leaflet-bar a,.dark .leaflet-control-layers,.dark .leaflet-control-attribution{background:var(--surface);color:var(--fg);border-color:var(--bd)}
.dark .leaflet-control-attribution a{color:var(--pri)}
.dark .leaflet-tooltip{background:var(--surface);color:var(--fg);border-color:var(--bd)}
@media (max-width:640px){body{flex-direction:column}#side{width:100%;max-width:none;height:55%}}
.sy{display:flex;gap:6px;align-items:flex-start;font-size:12px;color:var(--mut);margin-top:8px;line-height:1.35}.sy input{width:auto;flex:none;margin:2px 0 0;padding:0}.sy span{flex:1;min-width:0}
</style>
</head>
<body>
<div id="side">
  <div class="top">
    <div class="ttl"><h1>Peta Pelanggan</h1><span class="cnt" id="cnt">memuat…</span></div>
    <div class="srch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="Cari PPPoE, SN, atau nama"></div>
    <div class="seg"><button id="tOnt" class="on">ONT</button><button id="tOdp">ODP</button></div>
    <div class="lg"><span><i style="background:#16a34a"></i>Online</span><span><i style="background:#d97706"></i>Redaman lemah</span><span><i style="background:#dc2626"></i>Offline</span><span><i style="background:#6b7280"></i>Tanpa data</span><span><i style="background:#2563eb;border-radius:2px"></i>ODP</span></div>
    <button id="gps" class="btn full">Lokasi saya (GPS)</button>
    <label class="sy"><input type="checkbox" id="sync"><span>Sinkronkan ke tag device (dibaca aplikasi Android Genieacs.apk): LOC_/ODP_</span></label>
    <button id="imp" class="btn full" style="display:none;margin-top:8px"></button>
  </div>
  <div id="msg"></div>
  <div id="list"></div>
  <div id="edit"></div>
</div>
<div id="map"></div>
<div id="hint"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
// Leaflet dimuat dari unpkg.com di BROWSER; tanpa internet skrip di bawah berhenti. Beri pesan jelas, jangan layar kosong.
if(typeof L==="undefined"){
  document.getElementById("cnt").textContent="tanpa peta";
  var __m=document.createElement("div");__m.className="it";
  __m.innerHTML="<span class='tx'><span class='nm' style='color:var(--bad)'>Pustaka peta tidak bisa dimuat</span><span class='sub' style='white-space:normal'>Browser ini harus bisa membuka unpkg.com (Leaflet) serta tile OpenStreetMap/Esri. Cek koneksi internet atau ad-blocker, lalu muat ulang halaman.</span></span>";
  document.getElementById("list").appendChild(__m);
}
</script>
<script>
"use strict";
(function(){
  var M={"--bg":"--acs-bg","--surface":"--acs-surface","--fg":"--acs-text","--mut":"--acs-muted","--bd":"--acs-border","--pri":"--acs-accent","--soft":"--acs-soft","--on":"--acs-on-accent","--ok":"--acs-ok","--bad":"--acs-bad","--warn":"--acs-warn"};
  function ap(){var r=document.documentElement;try{var p=parent.document.documentElement,cs=parent.getComputedStyle(p);
    Object.keys(M).forEach(function(k){var v=cs.getPropertyValue(M[k]).trim();if(v)r.style.setProperty(k,v)});
    r.classList.toggle("dark",p.classList.contains("acs-dark"))}catch(e){}}
  ap();try{new MutationObserver(ap).observe(parent.document.documentElement,{attributes:true})}catch(e){}
})();
var state={devices:[],odps:[],tab:location.hash==="#odp"?"odp":"ont",sel:null};
var $=function(i){return document.getElementById(i)};
function el(tag,props,kids){var e=document.createElement(tag);Object.keys(props||{}).forEach(function(k){if(k==="text")e.textContent=props[k];else if(k.slice(0,2)==="on")e[k]=props[k];else e.setAttribute(k,props[k])});(kids||[]).forEach(function(c){e.appendChild(c)});return e}
function say(t){$("msg").textContent=t||""}

var map=L.map("map").setView([-2.5,118],5);
var osm=L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap",className:"osm-tiles"});
var sat=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Esri"});
osm.addTo(map);L.control.layers({"Peta":osm,"Satelit":sat}).addTo(map);
var layer=L.layerGroup().addTo(map);
var meLayer=L.layerGroup().addTo(map);

// ---- GPS (Geolocation API browser) ----
// Browser hanya mengizinkan GPS di HTTPS atau localhost; di http://IP:port diblokir. Cadangan: tempel koordinat.
function gps(cb){
  if(!navigator.geolocation)return say("Browser ini tidak mendukung GPS.");
  if(window.isSecureContext===false)return say("GPS diblokir browser di alamat http:// (butuh HTTPS atau localhost). Pakai 'Tempel koordinat' di bawah.");
  say("Mencari lokasi GPS…");
  navigator.geolocation.getCurrentPosition(function(p){
    var r={lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy)};
    say("GPS: "+r.lat+", "+r.lng+" (akurasi ±"+r.acc+" m)");cb(r);
  },function(e){
    say("GPS gagal: "+({1:"izin lokasi ditolak (cek pengaturan situs di browser)",2:"posisi tidak tersedia",3:"waktu habis"}[e.code]||e.message));
  },{enableHighAccuracy:true,timeout:20000,maximumAge:0});
}
function showMe(p){
  meLayer.clearLayers();
  L.circle([p.lat,p.lng],{radius:p.acc||10,color:"#2563eb",weight:1,fillOpacity:.1}).addTo(meLayer);
  L.circleMarker([p.lat,p.lng],{radius:7,color:"#fff",weight:2,fillColor:"#2563eb",fillOpacity:1}).addTo(meLayer).bindTooltip("Lokasi Anda");
  map.setView([p.lat,p.lng],Math.max(map.getZoom(),18));
}
// "-6.2001, 106.8166" (format salin dari Google Maps), juga "lat lng" atau "(lat;lng)"
function parseCoord(t){
  var m=String(t).match(/(-?\d+(?:\.\d+)?)\s*[,;\s]\s*(-?\d+(?:\.\d+)?)/);
  if(!m)return null;var la=+m[1],ln=+m[2];
  return la>=-90&&la<=90&&ln>=-180&&ln<=180?{lat:la,lng:ln}:null;
}
function posRow(cb){
  var inp=el("input",{type:"text",placeholder:"Tempel koordinat: -6.2001, 106.8166",style:"flex:1;min-width:0"});
  return el("div",{"class":"row pos"},[
    el("button",{"class":"btn",text:"Pakai GPS",onclick:function(){gps(function(p){showMe(p);cb(p)})}}),
    inp,
    el("button",{"class":"btn",text:"Set",onclick:function(){var c=parseCoord(inp.value);if(!c)return say("Format koordinat tidak dikenali");map.setView([c.lat,c.lng],Math.max(map.getZoom(),18));cb(c)}})]);
}

// ---- data: API GenieACS sendiri (sama-asal, memakai cookie login GenieACS) ----
// ONT dibaca dari /api/devices (hanya GET). Lokasi & ODP disimpan di satu key Config "peta.data"
// (JSON -> base64 dalam kutip tunggal, supaya tetap ekspresi Config yang valid).
/*TAGS*/
// Format tag aplikasi Android (Genieacs.apk, Alijaya): lokasi pelanggan disimpan sebagai TAG di device.
//   LOC_<lat*1e6>_<lng*1e6>            mis. LOC_-6123456_108345678   (juga dikenali: LOC:lat,lng  /  LOC-...)
//   ODP_<nama>_<lat*1e6>_<lng*1e6>     atau ODP_<nama> (tanpa koordinat)   (juga: ODP:nama@lat,lng)
// Nama ODP dibersihkan oleh aplikasi: spasi -> "-", karakter selain [A-Za-z0-9-_] dibuang.
function decodeTagKey(k){ // kunci UI API "Tags.<nama>" (nama disandi: encodeURIComponent lalu "%" -> "0x") -> nama tag
  if(String(k).indexOf("Tags.")!==0)return null;
  try{return decodeURIComponent(k.slice(5).replace(/0x(?=[0-9A-Z]{2})/g,"%"))}catch(e){return null}
}
function tagsFrom(d){var o=[];Object.keys(d).forEach(function(k){var t=decodeTagKey(k);if(t)o.push(t)});return o}
function validLL(lat,lng){return isFinite(lat)&&isFinite(lng)&&Math.abs(lat)<=90&&Math.abs(lng)<=180&&!(lat===0&&lng===0)}
function micro(v){return /^-?\d{4,}$/.test(v)?Number(v)/1e6:NaN}
function parseLoc(t){
  var m=/^LOC([:_\-])(.*)$/i.exec(String(t));if(!m)return null;
  var r=m[2],a;
  if(m[1]===":"||r.indexOf(",")>=0){a=r.split(",");var la=Number(a[0]),ln=Number(a[1]);return a.length===2&&validLL(la,ln)?{lat:la,lng:ln}:null}
  a=r.split("_");
  if(a.length!==2)return null;
  var lat=micro(a[0]),lng=micro(a[1]);
  if(!validLL(lat,lng)){lat=Number(a[0]);lng=Number(a[1])}   // desimal dengan "_" sebagai pemisah
  return validLL(lat,lng)?{lat:lat,lng:lng}:null;
}
function parseOdp(t){
  var m=/^ODP([:_\-])(.*)$/i.exec(String(t));if(!m||!m[2])return null;
  var r=m[2];
  var at=r.lastIndexOf("@");
  if(at>0){var c=r.slice(at+1).split(",");var la=Number(c[0]),ln=Number(c[1]);return {name:r.slice(0,at),lat:validLL(la,ln)?la:null,lng:validLL(la,ln)?ln:null}}
  var a=r.split("_");
  if(a.length>=3){var lat=micro(a[a.length-2]),lng=micro(a[a.length-1]);
    if(validLL(lat,lng))return {name:a.slice(0,a.length-2).join("_"),lat:lat,lng:lng}}
  return {name:r,lat:null,lng:null};
}
function odpClean(n){return String(n==null?"":n).trim().replace(/ /g,"-").replace(/[^a-zA-Z0-9\-_]/g,"")}
function encLoc(lat,lng){return "LOC_"+Math.round(lat*1e6)+"_"+Math.round(lng*1e6)}
function encOdp(name,lat,lng){var n=odpClean(name);return lat!=null&&lng!=null&&validLL(lat,lng)?"ODP_"+n+"_"+Math.round(lat*1e6)+"_"+Math.round(lng*1e6):"ODP_"+n}
function isGeoTag(t){return /^(LOC|ODP)[:_\-]/i.test(String(t))}
function appInfo(tags){var o={loc:null,odp:null};tags.forEach(function(t){if(!o.loc){var l=parseLoc(t);if(l)o.loc=l}if(!o.odp){var p=parseOdp(t);if(p&&p.name)o.odp=p}});return o}
/*ENDTAGS*/
var CFG="peta.data";
function api(method,path,body){
  return fetch(path,{method:method,credentials:"same-origin",headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined})
    .then(function(r){return r.text().then(function(t){
      if(r.status===401||r.status===403)throw new Error("Tidak diizinkan (login GenieACS sebagai admin dulu)");
      if(!r.ok)throw new Error("HTTP "+r.status+" "+t.slice(0,120));
      return t?JSON.parse(t):null})});
}
function readStore(){
  return api("GET","/api/config/?filter="+encodeURIComponent('_id LIKE "'+CFG+'"')).then(function(r){
    var s={devices:{},odps:{}},row=r&&r[0];
    if(row&&row.value){try{s=JSON.parse(decodeURIComponent(escape(atob(String(row.value).replace(/^['"]|['"]$/g,"")))))}catch(e){throw new Error("data peta.data rusak")}}
    s.devices=s.devices||{};s.odps=s.odps||{};return s});
}
function writeStore(s){
  var v="'"+btoa(unescape(encodeURIComponent(JSON.stringify(s))))+"'";
  return api("PUT","/api/config/"+CFG,{_id:CFG,value:v});
}
function mutate(fn){return readStore().then(function(s){var e=fn(s);if(e)throw new Error(e);return writeStore(s)})}
function num(v,lo,hi){var n=Number(v);return isFinite(n)&&n>=lo&&n<=hi?n:null}
function val(d,k){var x=d[k];return x&&x.value&&x.value[0]!=null?x.value[0]:null}

var PROJ=["DeviceID.ID","DeviceID.SerialNumber","DeviceID.ProductClass","Events.Inform","VirtualParameters.pppoeUsername","VirtualParameters.RXPower","VirtualParameters.redaman","Tags"].join(",");
function load(){
  return Promise.all([api("GET","/api/devices/?projection="+encodeURIComponent(PROJ)),readStore()]).then(function(r){
    var devs=r[0]||[],st=r[1],now=Date.now();
    // lokasi dari tag aplikasi Android: dipakai bila device belum punya entri di peta.data (peta.data tetap sumber utama)
    var odpBy={},fromApp={};
    Object.keys(st.odps).forEach(function(k){odpBy[odpClean(k)]=k;if(st.odps[k].name)odpBy[odpClean(st.odps[k].name)]=k});
    state.devices=devs.map(function(d){
      var id=val(d,"DeviceID.ID")||d._id,li=val(d,"Events.Inform"),t=typeof li==="number"?li:Date.parse(li)||0;
      var m=String(val(d,"VirtualParameters.RXPower")!=null?val(d,"VirtualParameters.RXPower"):val(d,"VirtualParameters.redaman")!=null?val(d,"VirtualParameters.redaman"):"").match(/-?\d+(\.\d+)?/);
      var tags=tagsFrom(d),app=appInfo(tags),loc=st.devices[id]||null;
      if(!loc&&app.loc){
        var oid="";
        if(app.odp){
          oid=odpBy[odpClean(app.odp.name)]||"";
          if(!oid&&app.odp.lat!=null){oid=odpClean(app.odp.name);if(oid){if(!fromApp[oid])fromApp[oid]={name:app.odp.name,lat:app.odp.lat,lng:app.odp.lng,capacity:8,notes:"dari tag aplikasi Android",fromApp:true};odpBy[oid]=oid}}
        }
        loc={name:"",lat:app.loc.lat,lng:app.loc.lng,odp:oid,notes:"",fromApp:true};
      }
      return {id:id,sn:val(d,"DeviceID.SerialNumber")||"",model:val(d,"DeviceID.ProductClass")||"",pppoe:val(d,"VirtualParameters.pppoeUsername")||"",
        rx:m?Number(m[0]):null,online:t>0&&now-t<10*60*1000,loc:loc,tags:tags};
    });
    var allOdps=Object.assign({},fromApp,st.odps),used={};
    state.devices.forEach(function(x){if(x.loc&&x.loc.odp)used[x.loc.odp]=(used[x.loc.odp]||0)+1});
    state.odps=Object.keys(allOdps).map(function(id){return Object.assign({id:id,used:used[id]||0},allOdps[id])});
    var nApp=state.devices.filter(function(x){return x.loc&&x.loc.fromApp}).length,nOdp=state.odps.filter(function(o){return o.fromApp}).length,im=$("imp");
    if(nApp||nOdp){im.style.display="block";im.textContent="Impor dari aplikasi Android: "+nApp+" titik ONT, "+nOdp+" ODP"}else im.style.display="none";
    draw();
    if(!state.fitted){ // pertama kali: zoom ke titik yang sudah dipetakan (bukan seluruh Indonesia)
      var pts=[];state.devices.forEach(function(x){if(x.loc)pts.push([x.loc.lat,x.loc.lng])});state.odps.forEach(function(o){pts.push([o.lat,o.lng])});
      if(pts.length){state.fitted=true;try{map.fitBounds(pts,{padding:[50,50],maxZoom:17})}catch(e){}}
    }
    var mapped=state.devices.filter(function(x){return x.loc}).length;
    $("cnt").textContent=mapped+"/"+state.devices.length+" ONT · "+state.odps.length+" ODP";
    say(mapped+" dari "+state.devices.length+" ONT sudah dipetakan, "+state.odps.length+" ODP");
  }).catch(function(e){
    $("cnt").textContent="gagal";say("Gagal memuat: "+e.message);
    var b=$("list");b.textContent="";
    b.appendChild(el("div",{"class":"it"},[el("span",{"class":"tx"},[el("span",{"class":"nm",style:"color:var(--bad)",text:"Data tidak bisa dimuat"}),
      el("span",{"class":"sub",style:"white-space:normal",text:e.message+". Pastikan login ke GenieACS sebagai admin; audit di server: bash scripts/diagnose.sh"})])]));
  });
}
function rxColor(d){if(!d.online)return "#dc2626";if(d.rx==null||isNaN(d.rx))return "#6b7280";return d.rx<-27?"#d97706":"#16a34a"}
function icon(color,sq){return L.divIcon({className:"",html:'<div style="width:'+(sq?16:14)+'px;height:'+(sq?16:14)+'px;background:'+color+';border:2px solid #fff;border-radius:'+(sq?"3px":"50%")+';box-shadow:0 0 3px #000"></div>',iconSize:[18,18],iconAnchor:[9,9]})}
function title(d){return (d.loc&&d.loc.name)||d.pppoe||d.sn||d.id}

function draw(){
  layer.clearLayers();
  state.devices.forEach(function(d){if(!d.loc)return;
    var m=L.marker([d.loc.lat,d.loc.lng],{icon:icon(rxColor(d))}).addTo(layer);
    m.bindTooltip(title(d));m.on("click",function(){select("ont",d.id)});
    if(d.loc.odp){var o=state.odps.filter(function(x){return x.id===d.loc.odp})[0];if(o)L.polyline([[d.loc.lat,d.loc.lng],[o.lat,o.lng]],{color:"#94a3b8",weight:1,dashArray:"4"}).addTo(layer)}
  });
  state.odps.forEach(function(o){var m=L.marker([o.lat,o.lng],{icon:icon("#2563eb",true)}).addTo(layer);
    m.bindTooltip(o.name+" ("+o.used+"/"+o.capacity+")");m.on("click",function(){select("odp",o.id)})});
  list();
}
function rxBadge(d){
  if(d.rx==null||isNaN(d.rx))return null;
  return el("span",{"class":"bdg "+(!d.online?"":d.rx<-27?"warn":"ok"),text:d.rx+" dBm"});
}
function list(){
  var q=$("q").value.toLowerCase(),box=$("list");box.textContent="";
  if(state.tab==="ont"){
    var rows=state.devices.filter(function(d){return !q||(d.pppoe+" "+d.sn+" "+(d.loc?d.loc.name:"")).toLowerCase().indexOf(q)>=0})
      .sort(function(a,b){return (a.loc?1:0)-(b.loc?1:0)||title(a).localeCompare(title(b))});
    rows.slice(0,300).forEach(function(d){
      var kids=[el("span",{"class":"dot",style:"background:"+rxColor(d)}),
        el("span",{"class":"tx"},[el("span",{"class":"nm",text:title(d)}),
          el("span",{"class":"sub",text:(d.loc?(d.loc.fromApp?"Dari aplikasi · ":""):"Belum dipetakan · ")+(d.model||d.sn||"-")})])];
      var b=rxBadge(d);if(b)kids.push(b);
      box.appendChild(el("div",{"class":"it"+(d.loc?"":" new")+(state.sel&&state.sel.id===d.id?" sel":""),onclick:function(){select("ont",d.id)}},kids));
    });
    if(rows.length>300)box.appendChild(el("div",{"class":"it"},[el("span",{"class":"sub",text:"Menampilkan 300 dari "+rows.length+". Persempit pencarian."})]));
    if(!rows.length)box.appendChild(el("div",{"class":"it"},[el("span",{"class":"sub",text:"Tidak ada ONT yang cocok."})]));
  }else{
    state.odps.filter(function(o){return !q||o.name.toLowerCase().indexOf(q)>=0}).forEach(function(o){
      var pct=Math.min(100,Math.round(o.used*100/(o.capacity||1)));
      box.appendChild(el("div",{"class":"it"+(state.sel&&state.sel.id===o.id?" sel":""),onclick:function(){select("odp",o.id)}},[
        el("span",{"class":"dot",style:"background:#2563eb;border-radius:3px"}),
        el("span",{"class":"tx"},[el("span",{"class":"nm",text:o.name}),el("span",{"class":"sub",text:o.used+" dari "+o.capacity+" port terpakai"}),
          el("span",{"class":"cap"},[el("i",{"class":pct>=100?"full":"",style:"width:"+pct+"%"})])])]));
    });
    box.appendChild(el("div",{"class":"it new",onclick:function(){select("odp",null)}},[el("span",{"class":"nm",text:"+ ODP baru"})]));
  }
}
function field(label,id,val,type){return [el("label",{text:label,"for":id}),el(type||"input",{id:id,value:val||""})]}
function select(kind,id){
  state.sel={kind:kind,id:id};state.tab=kind;$("tOnt").className=kind==="ont"?"on":"";$("tOdp").className=kind==="odp"?"on":"";
  var f=$("edit");f.textContent="";f.style.display="block";
  if(kind==="ont"){
    var d=state.devices.filter(function(x){return x.id===id})[0];if(!d)return;
    var l=d.loc||{};
    f.appendChild(el("h2",{text:d.pppoe||d.sn||"ONT"}));f.appendChild(el("div",{"class":"id",text:d.id}));
    if(l.fromApp)f.appendChild(el("div",{"class":"sub",style:"white-space:normal;margin:6px 0",text:"Titik ini berasal dari tag aplikasi Android (LOC_…). Tekan Simpan untuk menyimpannya juga di peta.data."}));
    field("Nama pelanggan","fName",l.name).forEach(function(x){f.appendChild(x)});
    var sl=el("select",{id:"fOdp"},[el("option",{value:"",text:"- tanpa ODP -"})].concat(state.odps.map(function(o){var op=el("option",{value:o.id,text:o.name+" ("+o.used+"/"+o.capacity+")"});if(o.id===l.odp)op.selected=true;return op})));
    f.appendChild(el("label",{text:"ODP"}));f.appendChild(sl);
    field("Catatan","fNotes",l.notes).forEach(function(x){f.appendChild(x)});
    f.appendChild(el("div",{"class":"row"},[
      el("button",{"class":"btn pri",text:l.lat!=null?"Pindah lokasi":"Tandai di peta",onclick:function(){pick(function(ll){saveOnt(d,ll.lat,ll.lng)})}}),
      el("button",{"class":"btn",text:"Simpan",onclick:function(){if(l.lat==null)return say("Tandai lokasi dulu");saveOnt(d,l.lat,l.lng)}}),
      el("button",{"class":"btn bad",text:"Hapus",onclick:function(){if(confirm("Hapus lokasi ONT ini?"))mutate(function(st){delete st.devices[d.id]}).then(function(){return tagSync(d,null,null,"")}).then(load).then(close).catch(function(e){say(e.message)})}})]));
    f.appendChild(posRow(function(ll){saveOnt(d,ll.lat,ll.lng)}));
    if(l.lat!=null)map.setView([l.lat,l.lng],Math.max(map.getZoom(),17));
  }else{
    var o=state.odps.filter(function(x){return x.id===id})[0]||{};
    f.appendChild(el("h2",{text:id?"ODP "+id:"ODP baru"}));
    if(!id)field("ID ODP (unik, mis. ODP-01)","oId","").forEach(function(x){f.appendChild(x)});
    field("Nama","oName",o.name).forEach(function(x){f.appendChild(x)});
    field("Kapasitas port","oCap",o.capacity||8,"input").forEach(function(x){f.appendChild(x)});
    field("Catatan","oNotes",o.notes).forEach(function(x){f.appendChild(x)});
    var idv=function(){return id||$("oId").value.trim()};
    var body=function(ll){return {name:$("oName").value,capacity:$("oCap").value,notes:$("oNotes").value,lat:ll.lat,lng:ll.lng}};
    var putOdp=function(ll){var i=idv();if(!i)return say("ID ODP wajib");var b=body(ll),cap=num(b.capacity,1,1024);
      mutate(function(st){st.odps[i]={name:String(b.name||"").trim().slice(0,120)||i,lat:b.lat,lng:b.lng,capacity:cap===null?8:Math.floor(cap),notes:String(b.notes||"").slice(0,500)}}).then(function(){return odpSync(i,{name:String(b.name||"").trim()||i,lat:b.lat,lng:b.lng})}).then(load).then(function(){say("ODP tersimpan"+($("sync").checked?" (tag ONT terhubung ikut diperbarui)":""))}).catch(function(e){say(e.message)})};
    f.appendChild(el("div",{"class":"row"},[
      el("button",{"class":"btn pri",text:o.lat!=null?"Pindah lokasi":"Tandai di peta",onclick:function(){pick(putOdp)}}),
      el("button",{"class":"btn",text:"Simpan",onclick:function(){if(o.lat==null)return say("Tandai lokasi dulu");putOdp({lat:o.lat,lng:o.lng})}}),
      el("button",{"class":"btn bad",text:"Hapus",onclick:function(){if(id&&confirm("Hapus ODP ini?"))mutate(function(st){delete st.odps[id];Object.keys(st.devices).forEach(function(k){if(st.devices[k].odp===id)st.devices[k].odp=""})}).then(function(){return odpSync(id,null)}).then(load).then(close).catch(function(e){say(e.message)})}})]));
    f.appendChild(posRow(putOdp));
    if(o.lat!=null)map.setView([o.lat,o.lng],Math.max(map.getZoom(),17));
  }
  list();
}
// Tulis tag lokasi ke device lewat UI API (POST /api/devices/<id>/tags, body {tag:true|false}); hanya bila kotak sinkron dicentang
function tagWrite(dev,body){
  if(!Object.keys(body).length)return Promise.resolve();
  return api("POST","/api/devices/"+encodeURIComponent(dev.id)+"/tags",body).catch(function(e){throw new Error("Tag device gagal ditulis ("+e.message+"). peta.data sudah tersimpan; matikan sinkron tag atau periksa izin.")});
}
function tagSync(d,lat,lng,odpId){
  if(!$("sync").checked)return Promise.resolve();
  var body={},odp=odpId?state.odps.filter(function(o){return o.id===odpId})[0]:null;
  (d.tags||[]).forEach(function(t){if(isGeoTag(t))body[t]=false});          // buang tag lokasi lama
  if(lat!=null&&lng!=null)body[encLoc(lat,lng)]=true;
  if(lat!=null&&odp)body[encOdp(odp.name||odp.id,odp.lat,odp.lng)]=true;
  return tagWrite(d,body);
}
function odpSync(odpId,odp){
  if(!$("sync").checked)return Promise.resolve();
  var linked=state.devices.filter(function(x){return x.loc&&x.loc.odp===odpId}).slice(0,200),chain=Promise.resolve();
  linked.forEach(function(x){chain=chain.then(function(){
    var body={};(x.tags||[]).forEach(function(t){if(/^ODP[:_\-]/i.test(t))body[t]=false});
    if(odp)body[encOdp(odp.name||odpId,odp.lat,odp.lng)]=true;
    return tagWrite(x,body)})});
  return chain;
}
$("imp").onclick=function(){
  var devs=state.devices.filter(function(x){return x.loc&&x.loc.fromApp}),odps=state.odps.filter(function(o){return o.fromApp});
  if(!confirm("Impor "+devs.length+" titik ONT dan "+odps.length+" ODP dari tag aplikasi Android ke peta.data?\nTag di ONT tidak diubah."))return;
  mutate(function(st){
    devs.forEach(function(x){if(!st.devices[x.id])st.devices[x.id]={name:"",lat:x.loc.lat,lng:x.loc.lng,odp:x.loc.odp||"",notes:"",updated:new Date().toISOString()}});
    odps.forEach(function(o){if(!st.odps[o.id])st.odps[o.id]={name:String(o.name).slice(0,120),lat:o.lat,lng:o.lng,capacity:o.capacity||8,notes:"dari tag aplikasi Android"}});
  }).then(load).then(function(){say("Impor selesai: "+devs.length+" ONT, "+odps.length+" ODP")}).catch(function(e){say(e.message)});
};
try{$("sync").checked=localStorage.getItem("peta.sync")!=="0"}catch(e){$("sync").checked=true}
$("sync").onchange=function(){try{localStorage.setItem("peta.sync",$("sync").checked?"1":"0")}catch(e){}};
function close(){state.sel=null;$("edit").style.display="none";$("edit").textContent="";list()}
function saveOnt(d,lat,lng){
  var odp=$("fOdp").value,name=$("fName").value,notes=$("fNotes").value;
  mutate(function(st){
    if(num(lat,-90,90)===null||num(lng,-180,180)===null)return "lat/lng tidak valid";
    if(odp&&!st.odps[odp])return "ODP tidak ada";
    st.devices[d.id]={name:String(name).trim().slice(0,120),lat:lat,lng:lng,odp:odp,notes:String(notes).slice(0,500),updated:new Date().toISOString()};
  }).then(function(){return tagSync(d,lat,lng,odp)}).then(load).then(function(){say("Tersimpan"+($("sync").checked?" (tag aplikasi Android ikut diperbarui)":""))}).catch(function(e){say(e.message)});
}
function pick(cb){
  var h=$("hint");h.textContent="Klik lokasi di peta (Esc batal)";h.style.display="block";map.getContainer().style.cursor="crosshair";
  function done(){h.style.display="none";map.getContainer().style.cursor="";map.off("click",on);document.removeEventListener("keydown",esc)}
  function on(e){done();cb({lat:+e.latlng.lat.toFixed(6),lng:+e.latlng.lng.toFixed(6)})}
  function esc(e){if(e.key==="Escape")done()}
  map.once("click",on);document.addEventListener("keydown",esc);
}
$("q").oninput=list;
$("gps").onclick=function(){gps(showMe)};
$("tOnt").onclick=function(){state.tab="ont";$("tOnt").className="on";$("tOdp").className="";list()};
if(state.tab==="odp"){$("tOnt").className="";$("tOdp").className="on"}
$("tOdp").onclick=function(){state.tab="odp";$("tOdp").className="on";$("tOnt").className="";list()};
load();
</script>
